# build prod versions of the queue service and dashboard for quick testing

services:
  queue-service-build:
    build:
      context: ../
      dockerfile: ./docker/queue-service/Dockerfile.prod
    image: blockqueue/bq-queue:latest

  queue-service-ui-build:
    build:
      context: ../
      dockerfile: ./docker/dashboard/Dockerfile.prod
    image: blockqueue/bq-queue-ui:latest
